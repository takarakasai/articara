[package]
name = "articara"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Takara Kasai <takara.kasai@gmail.com>"]
description = "A high-performance robot model editor built in Rust. articara focuses on seamless URDF/SRDF manipulation and kinematic structure visualization."

[features]
default = ["gui", "scripting"]
gui = ["dep:eframe", "dep:egui_plot", "dep:glow", "dep:env_logger"]
mujoco = ["dep:mujoco"]
serde = ["dep:serde", "nalgebra/serde-serialize"]
scripting = ["dep:rhai"]
# Live gait viewer (see `viz_feed`): subscribe to a `go2-gait-runner --viz`
# Zenoh stream and animate the loaded model. Pure-Rust transport (Zenoh), so
# this adds no DDS/C toolchain dependency.
viz = ["quadruped-gait/viz-sub"]

# The GUI binary and several examples only build with specific features.
# Declaring required-features lets `cargo build/test` with other feature
# sets (e.g. --no-default-features --features serde) skip them instead of
# failing to compile.
[[bin]]
name = "articara"
path = "src/main.rs"
required-features = ["gui"]

[[example]]
name = "go2_sim"
required-features = ["mujoco"]

[[example]]
name = "go2_crawl"
required-features = ["mujoco"]

[[example]]
name = "go2_linear_crawl"
required-features = ["mujoco"]

[[example]]
name = "go2_linear_crawl_sweep"
required-features = ["mujoco"]

[[example]]
name = "script_repl"
required-features = ["scripting"]

[dependencies]
eframe = { version = "0.34.1", features = ["glow"], optional = true }
egui_plot = { version = "0.35", optional = true }
env_logger = { version = "0.11.10", optional = true }
glow = { version = "0.17.0", optional = true }
legged-estimation = { path = "legged-estimation" }
log = "0.4.29"
misarta = { git = "https://github.com/takarakasai/misarta.git" }
misarta-formats = { git = "https://github.com/takarakasai/misarta.git" }
quadruped-gait = { path = "quadruped-gait" }
# MuJoCo auto-download is disabled on macOS because mujoco-rs does not support
# automatic download on this platform. Set MUJOCO_DYNAMIC_LINK_DIR or
# MUJOCO_STATIC_LINK_DIR to the MuJoCo lib directory before building.
mujoco = { package = "mujoco-rs", version = "4.0.1", optional = true }
nalgebra = "0.34.2"
parry3d = "0.25"
rhai = { version = "1", optional = true }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"], optional = true }
urdf-rs = "0.9.0"

[dev-dependencies]
approx = "0.5"
serde_json = "1"

[workspace]
members = [".", "legged-estimation", "misarta-py", "quadruped-gait", "xtask"]
default-members = [".", "legged-estimation", "quadruped-gait"]
