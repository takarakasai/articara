# quadruped-gait + bump the git rev) once that comparison no longer
# needs to track local-only commits.


[[example]]
name = "kyo46rs_selfcollision_check"
required-features = ["mujoco"]

[[example]]
name = "kyo46rs_leg_conditioning"
required-features = ["mujoco"]
