[package]
name = "articara"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Takara Kasai <takara.kasai@gmail.com>"]
description = "A high-performance robot model editor built in Rust. articara focuses on seamless URDF/SRDF manipulation and kinematic structure visualization."

[features]
default = ["gui", "scripting"]
gui = ["dep:eframe", "dep:egui_plot", "dep:glow", "dep:env_logger"]
mujoco = ["dep:mujoco"]
serde = ["dep:serde", "nalgebra/serde-serialize"]
scripting = ["dep:rhai"]
# Live gait viewer (see `viz_feed`): subscribe to a `go2-gait-runner --viz`
# Zenoh stream and animate the loaded model. Pure-Rust transport (Zenoh), so
# this adds no DDS/C toolchain dependency.
viz = ["quadruped-gait/viz-sub"]
policy-sim = ["dep:policy-runtime"]

# The GUI binary and several examples only build with specific features.
# Declaring required-features lets `cargo build/test` with other feature
# sets (e.g. --no-default-features --features serde) skip them instead of
# failing to compile.
[[bin]]
name = "articara"
path = "src/main.rs"
required-features = ["gui"]

[[example]]
name = "go2_sim"
required-features = ["mujoco"]

