[dependencies]
eframe = { version = "0.34.1", features = ["glow"], optional = true }
egui_plot = { version = "0.35", optional = true }
env_logger = { version = "0.11.10", optional = true }
glow = { version = "0.17.0", optional = true }
legged-estimation = { git = "https://github.com/takarakasai/quadruped-gait.git" }
log = "0.4.29"
misarta = { git = "https://github.com/takarakasai/misarta.git" }
misarta-formats = { git = "https://github.com/takarakasai/misarta.git" }
# Direct dependency (previously only transitive via quadruped-gait) so
# hosts driving a robot not shaped like quadruped-gait's 4-leg model
# (e.g. a biped) can call the generic task catalogue / Dynamics context
# directly. See examples/kyo46rs_squat.rs.
misa-wbc = { git = "https://github.com/takarakasai/misa-wbc.git" }
quadruped-gait = { git = "https://github.com/takarakasai/quadruped-gait.git" }
# Sim-deploy for the Go2 RL policy (`go2_policy_sim` example): the same
# deploy-side ONNX runtime the hardware runner uses. Optional so the GUI
# builds don't pull tract-onnx.
policy-runtime = { git = "https://github.com/takarakasai/quadruped-gait.git", optional = true }
# MuJoCo auto-download is disabled on macOS because mujoco-rs does not support
# automatic download on this platform. Set MUJOCO_DYNAMIC_LINK_DIR or
# MUJOCO_STATIC_LINK_DIR to the MuJoCo lib directory before building.
mujoco = { package = "mujoco-rs", version = "4.0.1", optional = true }
nalgebra = "0.34.2"
parry3d = "0.25"
rhai = { version = "1", optional = true }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
approx = "0.5"
serde_json = "1"

[workspace]
members = [".", "xtask"]

# TEMPORARY (dev-only, not pushed): pin quadruped-gait to the local
